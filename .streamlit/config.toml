[theme]
base = "light"
primaryColor = "#18181B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#09090B"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
# Hides the "Deploy" button and "..." menu via Streamlit's own supported
# option, instead of CSS-hiding the header element — CSS-hiding the whole
# header also hid the sidebar collapse/expand arrow, which lives inside it.
toolbarMode = "minimal"
